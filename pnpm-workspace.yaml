# Sem versão obrigatória do pnpm: validado com 9, 10, 11 e 12.
# O pnpm 9 exige "packages"; o 10 lê onlyBuiltDependencies e o 11+ lê allowBuilds.
packages:
  - .
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true

# O pnpm 11+ recusa pacote publicado há menos de um dia (minimumReleaseAge). O
# motor é da própria organização e cada versão costuma ser consumida no dia em
# que sai, então cada versão nova entra aqui.
minimumReleaseAgeExclude:
  - '@brucesantos/design-space@0.14.0'
